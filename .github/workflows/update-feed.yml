name: Atualizar feed

on:
  schedule:
    # 07:00, 12:00 e 18:00 no horário de Brasília (UTC-3) => 10:00, 15:00, 21:00 UTC
    - cron: "0 10,15,21 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions" no GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Rodar coleta e classificação
        run: node scripts/fetch-news.mjs

      - name: Publicar mudanças
        run: |
          git config user.name "panorama-bot"
          git config user.email "actions@github.com"
          git add docs/data/feed.json
          git diff --quiet --cached || git commit -m "Atualiza feed"
          git push
